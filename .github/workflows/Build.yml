name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stm32-build ./docker

      - name: Compile firmware inside container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            stm32-build \
            bash -c '
              cd /workspace/Debug
              make clean
              make all
            '

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            stm32-build \
            bash -c '
              cd /workspace/unit_test
              ceedling test:all
            '

      - name: Verify build outputs
        run: |
          ls -R Debug || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            Debug/*.elf
            Debug/*.bin
            Debug/*.hex
            Debug/*.map